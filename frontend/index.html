<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gestor de Tareas</title>
  <!-- Bootstrap CSS -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="bg-light">
  <div class="container py-5">
    <h1 class="mb-4 text-center">Gestor de Tareas</h1>

    <!-- Formulario -->
    <form id="taskForm" class="row g-2 mb-3">
      <div class="col-sm-6">
        <input
          id="title"
          type="text"
          class="form-control"
          placeholder="Título de la tarea"
          required
        />
      </div>
      <div class="col-sm-3">
        <select id="priority" class="form-select">
          <option value="baja">Baja</option>
          <option value="media">Media</option>
          <option value="alta">Alta</option>
        </select>
      </div>
      <div class="col-sm-3 d-grid">
        <button type="submit" class="btn btn-primary">
          Agregar tarea
        </button>
      </div>
    </form>
    <div id="error" class="text-danger mb-2"></div>

    <!-- Filtros -->
    <div class="btn-group mb-4" role="group">
      <button data-filter="" class="btn btn-outline-secondary filter-btn active">Todas</button>
      <button data-filter="alta" class="btn btn-outline-secondary filter-btn">Alta</button>
      <button data-filter="media" class="btn btn-outline-secondary filter-btn">Media</button>
      <button data-filter="baja" class="btn btn-outline-secondary filter-btn">Baja</button>
    </div>

    <!-- Lista de tareas -->
    <ul id="taskList" class="list-group"></ul>
  </div>

  <!-- Bootstrap JS bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
