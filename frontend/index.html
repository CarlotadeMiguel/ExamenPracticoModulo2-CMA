<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Gestor de Tareas</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h1>Gestor de Tareas</h1>

    <!-- Formulario -->
    <form id="taskForm">
      <input id="title" type="text" placeholder="Título de la tarea" />
      <select id="priority">
        <option value="baja">Baja</option>
        <option value="media">Media</option>
        <option value="alta">Alta</option>
      </select>
      <button type="submit">Agregar tarea</button>
    </form>
    <div id="error" class="error"></div>

    <!-- Filtros -->
    <div class="filters">
      <button data-filter="" class="filter-btn active">Todas</button>
      <button data-filter="alta" class="filter-btn">Alta</button>
      <button data-filter="media" class="filter-btn">Media</button>
      <button data-filter="baja" class="filter-btn">Baja</button>
    </div>

    <!-- Lista de tareas -->
    <ul id="taskList"></ul>
  </div>

  <script src="app.js"></script>
</body>
</html>
